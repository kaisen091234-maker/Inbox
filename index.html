<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>our little inbox 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dosis:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#7c5ce6;--p2:#9b82f5;--dk:#1b1a21;--ink:#2a2833;--lav:#e6e2ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,#111015,#26223a 55%,#4a3a8f);color:var(--ink);font:500 17px/1.4 "Dosis",system-ui,sans-serif;max-width:560px;margin:0 auto}
section{height:100%;display:flex;flex-direction:column}
#login{justify-content:center;align-items:center;padding:24px;gap:12px;text-align:center;color:#fff}
#login h1{margin:0;font-size:1.7rem;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#login p{margin:0 0 6px}
input{width:100%;border:3px solid #cfc6ee;background:#f4f2f8;color:var(--ink);border-radius:22px;padding:11px 16px;font:inherit;font-size:16px;outline:none}
input:focus{border-color:var(--p2)}
.btn{border:3px solid #cdbffc;background:var(--p);color:#fff;border-radius:22px;padding:11px 24px;font:inherit;font-weight:800;cursor:pointer;width:100%}
#err{color:#fff;background:rgba(124,92,230,.9);border-radius:12px;padding:4px 10px;font-size:.85rem}
#err:empty{display:none}
#chat{padding:10px 10px 0}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;background:#f6f4fa;border-radius:26px;border:3px solid #fff;box-shadow:0 0 0 3px #3a3942,0 6px 18px rgba(0,0,0,.45);overflow:hidden}
header{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#34333c,#16151b);color:#fff}
header h1{margin:0;font-size:1.25rem;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.4)}
header p{margin:0;font-size:.72rem}
#out{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
.check{height:10px;flex:none;background:conic-gradient(#fff 25%,#26252d 0 50%,#fff 0 75%,#26252d 0) 0 0/20px 20px}
#note{display:none;margin:8px 12px 0;padding:8px 10px;border-radius:14px;background:var(--lav);font-size:.82rem;text-align:center}
#msgs{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:14px;background:radial-gradient(circle,#ddd8ea 1.5px,transparent 2px) 0 0/26px 26px}
.empty{margin:auto;text-align:center;color:#8a84a3}
.row{display:flex;align-items:flex-end;gap:8px;max-width:92%}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.row.them{align-self:flex-start}
.col{display:flex;flex-direction:column;min-width:0}
.me .col{align-items:flex-end}.them .col{align-items:flex-start}
.av{flex:none;width:42px;height:42px;border-radius:50%;border:3px solid #fff;overflow:hidden}
.her .av{background:#e8dcff;box-shadow:0 0 0 2px var(--p),0 3px 0 rgba(0,0,0,.15)}
.him .av{background:#d4d2dc;box-shadow:0 0 0 2px #3a3942,0 3px 0 rgba(0,0,0,.15)}
.av img{width:100%;height:100%;display:block;image-rendering:pixelated}
.spark{position:absolute;top:-8px;width:17px;height:17px;image-rendering:pixelated}
.me .spark{left:-7px}.them .spark{right:-7px}
.tag{position:relative;z-index:1;margin:0 14px -9px;padding:1px 10px;background:#fff;border:2px solid;border-radius:12px;font-size:.7rem;font-weight:800;white-space:nowrap}
.her .tag{color:var(--p)}.him .tag{color:var(--dk)}
.bubble{position:relative;padding:15px 16px 11px;border-radius:20px;color:#fff;font-weight:700;word-break:break-word;white-space:pre-wrap;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);outline:2px dashed rgba(255,255,255,.6);outline-offset:-6px}
.her .bubble{background:linear-gradient(#9378f2,#7c5ce6)}
.him .bubble{background:linear-gradient(#4a4953,#24232a)}
.me .bubble{border-bottom-right-radius:6px}
.them .bubble{border-bottom-left-radius:6px}
.heart{position:absolute;bottom:-10px;font-size:1.1rem}
.me .heart{left:-8px}.them .heart{right:-8px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:var(--lav);flex:none}
.chip{flex:none;border:2px dashed #b6a6ff;background:#fff;color:var(--p);padding:4px 11px;border-radius:999px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
#bar{display:flex;gap:8px;align-items:center;padding:6px 10px 10px;background:var(--lav);flex:none}
#txt{flex:1;min-width:0;padding:9px 14px}
.round{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:#fff;font-size:1.1rem;cursor:pointer;padding:0}
#send{flex:none;border:3px solid #cdbffc;background:var(--p);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer}
#kb{flex:none;padding:8px 5px;display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
function sprite(rows, pal){
  let r = "";
  rows.forEach((row, y) => { for(let x = 0; x < row.length; x++){ const c = pal[row[x]]; if(c) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`; } });
  return "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges">${r}</svg>`);
}
const BUNNY = sprite([
"...KKK....KKK...","..KGGGK..KGGGK..","..KGGGK..KGGGK..","..KGGGK..KGGGK..",
"..KGGGK..KGGGK..","..KGGGK..KGGGK..","..KKKKKKKKKKKK..",".KKKKKKKKKKKKKK.",
".KKKWWKKKKWWKKK.",".KKKWWKKKKWWKKK.",".KKPKKKPPKKKPKK.",".KKKKKKKKKKKKKK.",
".KKKKKKKKKKKKKK.","..KKKKKKKKKKKK..","....KKKKKKKK....","................"
], {K:"#1b1a21", G:"#6b6a76", W:"#ffffff", P:"#ff9ccb"});
const CAT = sprite([
"..DD........DD..","..DOD......DOD..","..DOOD....DOOD..","..DOOOD..DOOOD..",
"..DOOOOOOOOOOD..","..DOOOOOOOOOOD..","..DOODOOOODOOD..","..DOOOOOOOOOOD..",
"..DOKKOOOOKKOD..","..DOKWOOOOWKOD..","..DOOOCCCCOOOD..","..DOOCCPPCCOOD..",
"..DOOCCCCCCOOD..","...DOOOOOOOOD...","....DDDDDDDD....","................"
], {D:"#c8641b", O:"#ff9a3c", K:"#1b1a21", W:"#ffffff", C:"#ffe2b8", P:"#ff7fa8"});
const SPARK = sprite([
"...X...","...X...","..XXX..","XXXWXXX","..XXX..","...X...","...X..."
], {X:"#b39dff", W:"#ffffff"});
const GHOST = sprite([
"....OOOO....","..OOWWWWOO..",".OWWWWWWWWO.",".OWWWWWWWWO.",".OWKWWWWKWO.",".OWKWWWWKWO.",
".OWPWWWWPWO.",".OWWWWWWWWO.",".OWWWWWWWWO.",".OWWWWWWWWO.",".OWWOWWOWWO.","..O..OO..O.."
], {O:"#5a4a9a", W:"#ffffff", K:"#1b1a21", P:"#ff9ccb"});
const BLOSSOM = sprite([
"....PPPP....","...PPPPPP...",".PP.PPPP.PP.","PPPPPRRPPPPP","PPPPRYYRPPPP","PPPPRYYRPPPP",
"PPPPPRRPPPPP",".PP.PPPP.PP.","...PPPPPP...","....PPPP...."
], {P:"#ff8fb8", R:"#d6336c", Y:"#ffe08a"});
const FLAME = sprite([
".....R......",".....RR.....","....RRR.R...","...RRRRRR...","..RRROORRR..","..RROOOORR..",
".RRROOOORRR.",".RROOYYOORR.",".RROYYYYORR.",".RROYYYYORR.","..RROOOORR..","...RRRRRR..."
], {R:"#e8452c", O:"#ff9a3c", Y:"#ffd25e"});
const HEART = sprite([
"..RRR..RRR..",".RRRRRRRRRR.",".RPPRRRRRRR.",".RPRRRRRRRR.",".RRRRRRRRRR.",
"..RRRRRRRR..","...RRRRRR...","....RRRR....",".....RR....."
], {R:"#ff5c9a", P:"#ffd1e6"});
$("send").onclick = submit;
txt.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); submit(); } });

/* ---- moods ---- */
const MOODS = ["😴 sleepy","🥰 happy","🥺 need hugs","😭 sad","🔥 hyped","🍜 hungry","💤 busy","🎮 gaming"];
MOODS.forEach(t => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = t; b.onclick = () => { $("moodTxt").value = t; };
  $("moodChips").appendChild(b);
});
function renderMoods(){
  const box = $("moods"); box.textContent = "";
  const mk = (email, own) => {
    const b = document.createElement("button");
    b.className = "mood " + (email === HER ? "her" : "him");
    const t = moods[email];
    b.textContent = (own ? "you" : nameOf(email)) + ": " + (t || (own ? "set your mood ✏️" : "—"));
    if(own) b.onclick = () => { $("moodTxt").value = moods[me] || ""; $("moodEd").hidden = false; }; else b.disabled = true;
    return b;
  };
  const other = ALLOWED.find(e => e !== me);
  if(other) box.appendChild(mk(other, false));
  if(me) box.appendChild(mk(me, true));
}
$("moodX").onclick = () => { $("moodEd").hidden = true; };
$("moodSave").onclick = () => {
  setDoc(doc(db, "moods", me), { text: $("moodTxt").value.trim().slice(0, 40), ts: serverTimestamp() })
    .then(() => { $("moodEd").hidden = true; })
    .catch(() => note("Couldn’t save your mood 🥺 — did the new rules get published?"));
};

/* ---- cute keyboard ---- */
const L = {SHIFT:"⇧", BKSP:"⌫", NUM:"123", ABC:"abc", EMO:"😊", SPACE:"space", ENTER:"💌", STK:"🐱"};
const CLS = {SHIFT:"fn", BKSP:"fn", NUM:"fn", ABC:"fn", EMO:"fn emo", STK:"fn emo", SPACE:"space", ENTER:"go"};
const A = s => Array.from(s);

  if(k === "SHIFT"){ shift = !shift; build(); return; }
  if(k === "NUM" || k === "ABC" || k === "EMO" || k === "STK"){ page = {NUM:"num", EMO:"emo", STK:"stk", ABC:"abc"}[k]; build(); return; }
  if(k === "ENTER"){ submit(); return; }
  if(k === "SPACE") k = " ";
  else if(page === "abc" && shift && /^[a-z]$/.test(k)){ k = k.toUpperCase(); shift = false; build(); }
  if(txt.value.length < 1000) txt.value += k;
  txt.scrollLeft = txt.scrollWidth;
}

kb.addEventListener("pointerdown", e => {
  const b = e.target.closest(".key"); if(!b) return;
  e.preventDefault();
  const k = b.dataset.k; press(k);
  if(k === "BKSP"){ clearTimeout(rt); clearInterval(ri); rt = setTimeout(() => { ri = setInterval(() => press("BKSP"), 60); }, 400); }
});
["pointerup","pointercancel","pointerleave"].forEach(ev => kb.addEventListener(ev, () => { clearTimeout(rt); clearInterval(ri); }));
kb.addEventListener("contextmenu", e => e.preventDefault());

function setMode(c){
  cute = c; kb.hidden = !c;
  txt.readOnly = c; txt.inputMode = c ? "none" : "text";
  $("mode").textContent = c ? "📱" : "🎀";
  $("mode").title = c ? "Use phone keyboard" : "Use cute keyboard";
  if(c) txt.blur(); else txt.focus();
}
$("mode").onclick = () => setMode(!cute);
build();

/* ---- login ---- */
$("go").onclick = async () => {
  $("err").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
  } catch(e) {
    $("err").textContent = (e.code === "auth/invalid-credential" || e.code === "auth/wrong-password" || e.code === "auth/user-not-found")
      ? "Wrong email or password 🥺" : "Couldn’t log in 🥺 — try again?";
  }
};
$("pass").addEventListener("keydown", e => { if(e.key === "Enter") $("go").click(); });
$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if(unsub){ unsub(); unsub = null; }
  if(unsubM){ unsubM(); unsubM = null; }
  seen = null; hearts = new Set(); moods = {};
  if(!user){
    me = null; $("chat").hidden = true; $("login").hidden = false; return;
  }
  me = user.email;
  $("login").hidden = true; $("chat").hidden = false;
  const other = ALLOWED.find(e => e !== me);
  $("who").textContent = "💬 " + (other ? nameOf(other) : "us");
  page = "abc"; shift = false; build(); setMode(true);
  unsubM = onSnapshot(collection(db, "moods"), snap => {
    moods = {}; snap.forEach(d => { moods[d.id] = d.data().text || ""; }); renderMoods();
  }, () => {});
  renderMoods();
  const q = query(collection(db, "messages"), orderBy("ts", "desc"), limit(200));
  unsub = onSnapshot(q, snap => {
    const list = snap.docs.map(d => {
      const x = d.data({ serverTimestamps: "estimate" });
      return { id: d.id, from: x.from, text: x.text, heart: x.heart, ts: x.ts && x.ts.toDate ? x.ts.toDate() : null };
    }).reverse();
    render(list);
  }, () => note("Can’t read messages 🥺 — check your security rules or log in again."));
});
</script>
</body>
</html>
